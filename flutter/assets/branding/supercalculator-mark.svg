<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SuperCalculator - Next Era</title>
  <desc id="desc">A bold white sigma glyph on a warm rose, orange and amber gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E63"/>
      <stop offset="0.5" stop-color="#FF7A18"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
    <radialGradient id="highlight" cx="30%" cy="26%" r="62%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="86%" cy="90%" r="72%">
      <stop offset="0" stop-color="#28081A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#28081A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="round"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#highlight)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>

    <!-- Soft shadow beneath the glyph -->
    <path d="M724 300 L300 300 L500 512 L300 724 L724 724"
          fill="none" stroke="#460A23" stroke-opacity="0.55" stroke-width="104"
          stroke-linecap="round" stroke-linejoin="round"
          transform="translate(0 16)" filter="url(#glyphShadow)"/>

    <!-- Sigma glyph -->
    <path d="M724 300 L300 300 L500 512 L300 724 L724 724"
          fill="none" stroke="#FFFFFF" stroke-width="104"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Sparkles -->
    <polygon fill="#FFFFFF" fill-opacity="0.92"
             points="790,166 804,218 856,232 804,246 790,298 776,246 724,232 776,218"/>
    <polygon fill="#FFFFFF" fill-opacity="0.82"
             points="236,750 244.9,783.1 278,792 244.9,800.9 236,834 227.1,800.9 194,792 227.1,783.1"/>
  </g>
</svg>
